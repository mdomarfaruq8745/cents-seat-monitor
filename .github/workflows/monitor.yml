name: CEnT-S seat monitor

on:
  schedule:
    # GitHub's minimum scheduled interval is 5 minutes.
    # Offset from minute 0 to reduce top-of-hour queue congestion.
    - cron: "2-59/1 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cents-seat-monitor
  cancel-in-progress: false

jobs:
  check-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check out repository and saved seat history
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check CISIA calendar and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save seat history for the next run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update CEnT-S seat history"
            git push
          else
            echo "Seat history unchanged."
          fi
